  "Depth drops — 3x5": {

    why: "Deceleration causes more knee injuries than acceleration in soccer. Depth drops train your nervous system and muscles to absorb force quickly and safely — the exact skill needed when you land from a header or decelerate to receive a pass under pressure.",
    cue: "Land on the balls of your feet first — soft knees, quiet landing."
  },
  "5-10-5 shuttle — 5 reps": {
    how: ["Set 3 cones: 5 yards apart in a line.", "Start at the middle cone. Sprint 5 yards to one side, touch the line.", "Sprint 10 yards to the other side, touch that line.", "Sprint 5 yards back through the middle. Full recovery between reps."],
    why: "The 5-10-5 is the gold standard test for change-of-direction speed — exactly what separates elite midfielders from average ones. Soccer analysis shows midfielders make a sharp direction change every 4-6 seconds on average. Training this makes those changes faster and more explosive.",
    cue: "Sink into the cut — drop your hips, plant hard, and explode out."
  },
  "T-drill — 5 reps": {
    how: ["Set 4 cones in a T shape: start, 10y straight, then 5y left and 5y right.", "Sprint to the center, shuffle left to touch cone, shuffle right to touch far cone, shuffle back to center, backpedal to start.", "Stay low and never cross your feet during shuffles.", "Time yourself — track improvement."],
    why: "The T-drill combines forward acceleration, lateral movement, and backpedaling — the three direction changes you make constantly as a central midfielder. Tracking your times lets you measure whether your agility training is actually improving your speed in game-realistic movements.",
    cue: "Stay low throughout — never stand up tall during direction changes."
  },
  "Reactive cone drill — 4 reps": {
    how: ["Set cones in various positions around you.", "Have someone point or call a direction — react and sprint to that cone.", "Return to center and wait for the next signal.", "The key is minimizing reaction time — go on the signal, not before."],
    why: "Soccer decisions happen in under a second — the midfielder who reads and reacts fastest controls the game. Reactive drills train your nervous system to process visual information and move explosively, which directly translates to intercepting passes, closing down opponents, and finding space.",
    cue: "Wait for the signal — don't anticipate. Pure reaction."
  },
  "Med ball chest throw — 3x8": {
    how: ["Stand facing a wall (or partner) about 3-4 feet away, hold med ball at chest.", "Throw explosively from chest, like a basketball chest pass.", "Catch the rebound and immediately throw again — keep it quick.", "8 reps per set."],
    why: "Upper body power transfers to every physical contest in soccer — shoulder challenges, holding off defenders, taking throw-ins. Explosive chest throws train the same fast-twitch fibers you use when you push off a defender to receive the ball or win a header.",
    cue: "Make it fast and snappy — this is a power drill, not strength."
  },
  "Med ball rotational throw — 3x8 each side": {
    how: ["Stand sideways to a wall, hold med ball with both hands.", "Rotate your torso away from the wall (wind up), then explosively rotate and throw the ball against the wall.", "Catch the rebound, immediately wind up again.", "8 throws each side."],
    why: "The rotational power you build here is the exact same movement as your shooting and long passing motion. Every driven shot or 40-yard switch pass uses rotational power from your core and hips. This trains it in the fastest way possible.",
    cue: "Hips lead — rotate hips first, then core, then arms. Like a golf swing."
  },
  "Sled push — 4x20m": {
    how: ["Load the sled with moderate weight — challenging but you can maintain form.", "Drive forward at roughly 45° body angle, arms straight, pushing through legs.", "Powerful full steps — don't shuffle.", "20 meters each push, walk back for recovery."],
    why: "Sled pushes build raw acceleration power with zero injury risk to your hips or back. The forward lean and explosive leg drive directly mimic your sprint mechanics. Midfielders who train sled pushes develop faster first steps — crucial for pressing, recovering position, and making runs.",
    cue: "Drive through your toes — full leg extension on every step."
  },
  "Single leg RDL bodyweight — 3x10 each": {
    how: ["Stand on one leg, slight bend in the standing knee.", "Hinge forward at the hip, extending the other leg behind you for balance.", "Lower your torso until it's roughly parallel to the floor.", "Drive through your standing heel to return. Arms reach toward the floor for balance."],
    why: "Single-leg RDLs build hamstring strength and hip stability on each leg independently — essential since soccer is almost entirely single-leg movement. This also directly trains the deceleration control you need to stop, change direction, and land safely.",
    cue: "Hinge at the hip — don't just lean or bend your back."
  },
  "Single leg box landing hold — 3x5 each": {
    how: ["Stand on a box (6-12 inches). Step off and land on ONE foot.", "Absorb the landing, hold balance for 3 full seconds before standing.", "Focus on your landing knee — make sure it doesn't cave inward.", "5 landings each leg."],
    why: "Most ACL injuries in soccer happen during single-leg landings — when the knee caves in on a jump or a cut. This drill trains your body to land safely every time, building the stability to protect your knee through thousands of landings across a season.",
    cue: "Knee over second toe on landing — never let it cave inward."
  },
  // ── FACILITY TECHNICAL ─────────────────────────────────────────────────────
  "Dynamic stretch + jog": {
    how: ["Jog 2 laps of the facility to raise your heart rate.", "Add dynamic movements: leg swings, hip circles, walking lunges, high knees.", "Gradually increase pace over the last lap.", "This should take 5-7 minutes — don't rush it."],
    why: "Your muscles produce more force and react faster when they're warm. A proper warmup increases blood flow, loosens the hip flexors, and gets your nervous system ready to process the ball quickly. Skipping warmup means your first 15 minutes of technical work are at reduced quality.",
    cue: "Every warmup touch matters — engage your brain from the first step."
  },
  "Ball mastery — toe taps, inside/outside rolls (5 min)": {
    how: ["Toe taps: alternate feet tapping top of ball quickly — build up speed.", "Inside rolls: use inside of foot to roll ball across your body, switch feet.", "Outside rolls: outside of foot rolls ball away, step over, repeat other side.", "Do all 3 moves continuously for 5 min, no stopping."],
    why: "Ball mastery builds the neural pathways that make close control automatic. The goal isn't just to touch the ball — it's to make these touches unconscious so in a game your brain is free to think about positioning and decision-making, not ball control. Elite midfielders have thousands of hours of ball mastery.",
    cue: "Eyes up as much as possible — train yourself to feel the ball, not watch it."
  },
  "Driven passes at target — 50 reps each foot": {
    how: ["Set a target on the wall (tape or cone) at goal height.", "Plant foot beside the ball, locked ankle, strike through the middle with your instep.", "Follow through toward the target — your kicking leg swings through, not across.", "50 reps each foot. Focus on quality, not rushing."],
    why: "Passing accuracy is the most important technical skill for a central midfielder. An 8 or 6 who consistently plays accurate driven passes under pressure controls the tempo of the entire team. Each rep is building the muscle memory that makes a 40-yard switch pass feel effortless.",
    cue: "Locked ankle, through the middle of the ball — every single rep."
  },
  "One-touch wall combinations — 3x2 min": {
    how: ["Stand close to the wall (2-3 feet), pass and receive one-touch.", "Use both feet. Vary angles — pass across your body, receive on the other foot.", "Try to maintain a consistent rhythm — pass, touch, pass, touch.", "Keep it going for 2 minutes straight. If you lose it, restart."],
    why: "One-touch combinations train the speed of play that separates elite midfielders. In the Premier League, elite 8s and 6s regularly play one-touch under intense pressure. These sessions build the instinctive first touch and quick decision speed that makes you unplayable in tight spaces.",
    cue: "Soft touch first, then weight on return — don't smash both passes."
  },
  "Receiving across body + turning — 3x10 each foot": {
    how: ["Pass the ball to the wall at an angle, receive it with the far foot (across your body).", "As you receive, use the touch to turn and face the other direction.", "The first touch controls AND positions you simultaneously.", "10 reps each foot. Both feet must get equal work."],
    why: "Receiving across your body to turn is one of the most important skills for a central midfielder who constantly has pressure from behind. Every time you get the ball in the midfield third, you need to receive, assess, and play quickly. This trains the automatic touch that buys you time.",
    cue: "First touch takes you away — receive away from where the ball came from."
  },
  "Long driven pass at target — 3x10 each foot": {
    how: ["Set a target 20-30 yards away (or use the far end of the wall).", "Non-kicking foot alongside ball, lean slightly over it.", "Strike with your instep (laces) — full follow through.", "Aim for the same spot every time. 10 reps each foot."],
    why: "A central midfielder who can switch the play with a driven 40-yard pass is worth their weight in gold. Changing the point of attack puts the opposition out of shape and creates goal-scoring opportunities. This is a key skill to develop now before high-level competition demands it.",
    cue: "Lean over the ball — leaning back sends it high, not long."
  },
  "Cone weave at pace — 5 runs": {
    how: ["Set 6-8 cones in a line, 1 yard apart.", "Dribble through at pace — alternate feet, stay on your toes.", "Head up as much as possible. Change speed through the cones.", "Walk back to start, then repeat 5 times."],
    why: "Cone weaves at speed build the close-control dribbling needed to escape a press or carry the ball through a tight midfield. As a central 8, you'll often need to dribble through compact lines before releasing the ball. Speed through cones trains the touches needed to do this confidently.",
    cue: "Head up — feel the ball, don't watch it."
  },
  "L-cuts and V-cuts — 3x10 each": {
    how: ["L-cut: dribble forward, plant outside foot hard, cut 90° inward.", "V-cut: dribble forward, cut ball sharply at 45° back in opposite direction.", "Explode away after every cut — don't slow down, accelerate.", "10 each move, alternating feet."],
    why: "Cuts at 90° and 45° are the primary ways midfielders create space to receive the ball. Done with sharp deception and explosive acceleration, these moves make you impossible to mark. Training them as muscle memory means you execute perfectly under match pressure.",
    cue: "Sell the fake — commit with your body before cutting."
  },
  "1v1 moves (stepover, Cruyff, elastico) — 3x10 each": {
    how: ["Stepover: rotate foot around the ball without touching it, push away with outside foot.", "Cruyff: shape to pass or cross, drag ball behind your standing leg and accelerate.", "Elastico: push ball outside with outside of foot, immediately flick it back inside.", "10 reps of each move. Slow to learn the movement, then build speed."],
    why: "A central midfielder who can beat players 1v1 changes the entire dynamic of a team's attack. When central mids can dribble, it draws extra defenders which creates space for teammates. These three moves are universally effective at all levels — they'll still work in college and pro soccer.",
    cue: "The step is the lie — make your body believe you're going the other way."
  },
  "Dribble at speed + sharp stop — 5 reps": {
    how: ["From the end of the facility, accelerate at full speed with the ball.", "At full pace, plant your foot and stop the ball dead under your foot.", "Hold 1 second, then accelerate again in a different direction.", "5 reps. This should be max effort — full speed."],
    why: "Controlling the ball at full speed and being able to stop instantly is what separates good from elite dribblers. In games, the moments of highest value happen at high speed — an explosive run followed by a sharp stop beats a defender who is already committed. Train this at full intensity.",
    cue: "Full speed — don't slow down early. The stop is in one step."
  },
  "Driven low shots near post — 10x each foot": {
    how: ["Set up 12-18 yards from the wall (or goal). Ball played to your preferred side.", "Strike with your instep toward the near post — keep it low.", "Follow through along the ground — don't lean back.", "10 shots each foot. Prioritize placement over power."],
    why: "Near post shots are the highest percentage finish in soccer — the goalkeeper has less time and ground to cover. A central midfielder who arrives late into the box and drives it near post scores goals. Training this shot with both feet means you're dangerous from any angle.",
    cue: "Placement first — low and near post beats power every time."
  },
  "Driven low shots far post — 10x each foot": {
    how: ["Same setup, but angle your body and aim for the far post.", "Open your hips slightly toward the target.", "Strike across the ball slightly to bend it to the far post.", "10 each foot. This develops your ability to manipulate ball flight."],
    why: "Far post shots require bending the ball and placing it precisely — a more advanced technique that gives goalkeepers no chance when done well. As an 8 who arrives into the box, the ability to pick near or far post instantly based on the keeper's position is an elite finishing skill.",
    cue: "Strike across the inside of the ball to bend it."
  },
  "Volleys — 10x each foot": {
    how: ["Toss the ball up slightly or bounce it off the wall.", "Strike it out of the air with your instep — foot pointed down, ankle locked.", "Keep the shot low — lean over the ball at contact.", "10 volleys each foot."],
    why: "Volleys are high-value finishing moments in games — a midfielder arriving late at the far post or receiving a clearance and volleying first time. Volley technique is 80% about body position — leaning over the ball. Train it now and it becomes automatic under match pressure.",
    cue: "Lean over it — keep your weight forward at contact."
  },
  "Free kick practice — 10 reps": {
    how: ["Set up at varying distances (18-30 yards) and angles.", "Consistent run-up: 2-3 steps at an angle, non-kicking foot beside the ball.", "Strike with the instep or knuckle technique for swerve or power.", "10 kicks from different positions. Visualize the wall and target before each."],
    why: "You're the team's free kick taker — this is your moment to be the match-winner. Regular, deliberate free kick practice builds the muscle memory to execute under pressure when 1,000 people are watching. Set piece goals win close games. This practice time is gold.",
    cue: "Same run-up, same plant foot position, every single time — consistency is everything."
  },
  "First touch + shoot — 10x each foot": {
    how: ["Pass or bounce the ball, receive with a controlled first touch that sets up the shot.", "Your first touch should take you into space — not dead at your feet.", "Shoot immediately on the second touch. No extra touches.", "10 reps each foot. Vary the angle of the first touch."],
    why: "The best goals in soccer are first touch control, second touch finish. The longer you take to shoot, the more time defenders have to close you down. A central midfielder who can receive and shoot in two touches is extremely dangerous in the box. This trains that instinctive sequence.",
    cue: "Touch to space, not to feet — your first touch opens the shot."
  },
  "Passing wall work weak foot only — 50 reps": {
    how: ["Stand close to the wall, use only your weak foot for every rep.", "Start slowly — technique over speed.", "Drive through the ball with a locked ankle, aim for the same target.", "50 reps. This is non-negotiable — weak foot work is a daily requirement."],
    why: "Every elite central midfielder has two good feet. A weak foot is a vulnerability that defenders will exploit — they'll force you to your weak side every chance they get. 50 passes a day with your weak foot will, over months, make it nearly as reliable as your strong foot. This is how you become two-footed.",
    cue: "Locked ankle — the same technique as your strong foot, every rep."
  },
  "Shooting weak foot — 10 reps": {
    how: ["Set up shots at goal from 12-15 yards, weak foot only.", "Slow approach, focus on ankle lock and follow through.", "Don't try to blast it — focus on clean contact and accuracy.", "10 reps. A goal with your weak foot feels better than any other."],
    why: "Defenders will always try to force you onto your weak foot in the box. A midfielder who can finish with both feet doubles the defensive problem — there's no safe side to push you to. 10 weak foot shots a day will, over a summer, add a reliable second finishing option.",
    cue: "Clean contact over power — accuracy first, power comes with confidence."
  },
  "Static stretch — hip flexors, quads, hamstrings": {
    how: ["Hip flexor: kneeling lunge, tuck pelvis under, lean forward gently. 60 sec each side.", "Quad: standing, hold ankle behind you, keep knees together. 60 sec each.", "Hamstring: seated or lying, extend leg and reach toward foot. 60 sec each side.", "Breathe slowly — don't bounce or force the stretch."],
    why: "Stretching after technical work while your muscles are warm is the most effective time to improve flexibility. Flexible hip flexors and hamstrings reduce injury risk and improve your ability to generate power in shooting and sprinting. This is how you maintain and improve mobility as you grow.",
    cue: "Never stretch to pain — find the tension and breathe into it."
  },
  // ── FACILITY SPEED ─────────────────────────────────────────────────────────
  "Jog + dynamic stretch": {
    how: ["2-3 minute easy jog to raise heart rate.", "Add: leg swings, walking lunges, high knees, butt kicks, A-skips.", "Gradually increase pace over the last minute.", "By the end you should feel warm and loose — ready to sprint."],
    why: "Sprint sessions require your muscles and joints to work at maximum intensity. A proper warmup reduces injury risk and lets you actually hit true maximum speed — which is the whole point. Athletes who skip warmup never truly reach max velocity.",
    cue: "Take the full warmup seriously — your fastest sprint times come after the best warmups."
  },
  "Acceleration drills — falling starts, wall drives 3x10m": {
    how: ["Falling start: lean forward from ankles until gravity takes you, then sprint.", "Wall drive: hands on wall at 45°, drive knee up explosively 10 times, then sprint out.", "Cover 10m each rep at max acceleration.", "3 reps each drill — full recovery between."],
    why: "The first 3-5 meters of acceleration determine whether you beat your opponent to the ball. These drills train the forward lean and powerful leg drive that produce explosive starts. Midfielders who win those first-step battles control games.",
    cue: "Lean forward first — acceleration comes from your body angle, not your legs."
  },
  "Band resisted hip flexion — 2x10 each": {
    how: ["Attach a band low behind you, stand facing away from the anchor.", "Drive your knee up against the band's resistance — full range of motion.", "Control the return — don't let the band snap your leg back.", "10 reps each leg. Focus on the hip flexor working against resistance."],
    why: "Resisted hip flexion directly strengthens the hip flexors that lift your leg in the drive phase of sprinting. Stronger hip flexors mean a more powerful stride and faster top speed. This also protects the ASIS site by strengthening the muscles that attach there.",
    cue: "Drive the knee up high — full range of motion every rep."
  },
  "10m acceleration sprints — 8 reps": {
    how: ["From a standing or 3-point stance, sprint maximum effort for 10 meters only.", "Focus entirely on the first 3 steps — explosive, powerful, low angle.", "Walk back to start. Full recovery (60+ seconds) before next rep.", "8 reps total. Every rep is max effort — don't conserve energy."],
    why: "10-meter acceleration is the most game-relevant speed in soccer. 80% of sprints in a game are under 20 meters and most start from a standing or walking pace. Training max-effort acceleration over this distance makes you significantly faster at winning balls and closing down opponents.",
    cue: "Max effort every rep — if rep 8 doesn't feel as fast as rep 1, rest longer."
  },
  "30m sprints — 6 reps": {
    how: ["From a standing start, sprint 30 meters at maximum effort.", "Focus on maintaining acceleration through 15 meters, then top speed.", "Walk back to start — take 90+ seconds between reps.", "6 reps total. Time them to track progress."],
    why: "30-meter sprints develop your top speed — the ability to break away from midfielders who are chasing you. A midfielder with elite top speed can make runs beyond the defense that opponents simply can't match. Time your runs and track them — this is measurable progress.",
    cue: "Pump your arms — arm speed drives leg speed. Go!"
  },
  "Flying 20m — 4 reps": {
    how: ["Set up with a 20m build-up zone then a 20m timing zone.", "Gradually accelerate through the first 20m, then sprint maximum through the second 20m.", "The goal is to hit top speed BEFORE the timing zone.", "4 reps, full recovery between."],
    why: "Flying 20s are how sprinters develop true max velocity — speed at its absolute peak. Most field training never reaches true top speed because you run out of acceleration distance. Flying 20s fix that. Running at true top speed regularly makes you faster over time.",
    cue: "Be at full speed before you hit the second cone — the timing zone is flat out."
  },
  "Resisted sprints — 4x20m": {
    how: ["Attach a resistance band or sled behind you.", "Sprint 20m against the resistance — maintain good form, don't lean too far forward.", "The load should slow you by 10-15% but not break your technique.", "Walk back, 90 seconds rest, 4 reps."],
    why: "Resisted sprints overload the same muscles you use to accelerate — making them stronger without changing your movement pattern. After a session of resisted sprints, unresisted sprints feel effortless. This contrast effect is used by professional athletes worldwide to improve speed.",
    cue: "Maintain tall posture — don't let the resistance pull you into a hunch."
  },
  "Ladder — Ickey shuffle — 3 reps": {
    how: ["Ickey shuffle: 2 feet in one box, step outside with lead foot, step next foot in next box, step first foot outside.", "Pattern: In-In-Out, moving down the ladder.", "Stay on the balls of your feet. Build to max speed.", "3 runs down the ladder, walk back between."],
    why: "Ladder drills train foot speed and coordination — the ability to move your feet quickly in tight spaces. Midfielders constantly deal with tight spaces where quick feet create half-yards of space. Fast feet in the ladder translate to faster footwork when receiving the ball in traffic.",
    cue: "Stay on your toes — flat-footed ladder work defeats the purpose."
  },
  "Ladder — in-in-out-out — 3 reps": {
    how: ["Both feet enter each box individually (in-in), then both feet exit to the side (out-out).", "Travel laterally down the ladder.", "Quick, light contacts — minimize ground contact time.", "3 lateral runs each direction."],
    why: "This pattern trains lateral foot speed — the quickness needed to shuffle sideways to defend or to quickly open your hips to receive. Central midfielders who can move their feet quickly laterally are much harder to press and much better at tracking runners.",
    cue: "Quick, light, quick, light — minimize time on the ground."
  },
  "Ladder — lateral — 3 reps": {
    how: ["Stand to the side of the ladder. Shuffle laterally, both feet entering each box.", "Maintain athletic stance throughout — don't stand up tall.", "3 runs each direction. Add a sprint at the end of each run.", "Head up, arms pumping."],
    why: "Lateral agility is the defining physical quality of elite central midfielders. The ability to shuffle laterally, track runs, and recover position quickly separates good midfielders from great ones. Every rep here directly improves your defensive positioning and ability to cover ground.",
    cue: "Stay low and wide — narrow stance kills lateral speed."
  },
  "Reactive agility — mirror/cone — 5 reps": {
    how: ["Set up randomly placed cones within 10 yards in front of you.", "Have someone point to a cone or call a direction. React immediately.", "Sprint to that cone, touch it, return to center.", "5 reactive reps — the point is response to a random signal, not anticipated movement."],
    why: "Soccer agility is reactive — you don't know which direction you'll need to go until a ball breaks or an opponent moves. Reactive drills train your nervous system to process visual signals and respond explosively, making you faster in unpredictable game situations where the outcome actually matters.",
    cue: "Fire on the signal — don't lean one way in anticipation."
  },
  "5-10-5 timed — 5 reps": {
    how: ["3 cones 5 yards apart in a line. Start at middle.", "Sprint 5 yards, touch line. Sprint 10 yards to opposite line, touch. Sprint 5 yards back through middle.", "Get someone to time you or use a stopwatch.", "5 reps, full recovery. Track your times."],
    why: "Timing your 5-10-5 is how you measure your change-of-direction speed — one of the most important athletic qualities for midfielders. As your strength and agility training improves, your times will drop. Quantifying your speed improvement keeps you accountable and motivated.",
    cue: "Plant hard, drive hard — the turns are where time is won and lost."
  },
  "Ball-integrated agility — dribble cones max effort — 5 runs": {
    how: ["Set up agility course with cones — weaves, gates, turns.", "Dribble through at absolute maximum effort.", "The ball should feel like an extension of your foot even at speed.", "5 runs. Rest between each."],
    why: "Speed with the ball is different from speed without it. Ball-integrated agility training combines your technical skills with your physical speed — training the coordination of controlling a ball while running at maximum intensity. This is the most game-specific form of agility training you can do.",
    cue: "Head up — know where the next cone is before you get there."
  },
  "10x 30m sprint + jog back": {
    how: ["Sprint 30m at hard effort (90%), jog back to start.", "Continuous: as soon as you return, sprint again.", "10 sprints total. Effort level: 90% — not max but not easy.", "This is conditioning — maintain quality for all 10 reps."],
    why: "Soccer fitness is the ability to repeatedly sprint and recover — a midfielder runs 8-10km but with 50+ sprints embedded in it. This drill trains exactly that: repeated sprint ability, which determines how fast you still are in minute 85. Fitness wins the games you'd otherwise draw.",
    cue: "Hold 90% quality to the end — if it drops below 80%, rest 30 seconds."
  },
  // ── CONDITIONING ───────────────────────────────────────────────────────────
  "Format A: 8x 30 sec hard run / 30 sec walk": {
    how: ["Run hard (8/10 effort) for exactly 30 seconds.", "Walk for exactly 30 seconds.", "Repeat 8 times — do not skip any intervals.", "Use a timer or count in your head."],
    why: "This interval format trains your aerobic and anaerobic systems simultaneously — building both your engine and your ability to recover between efforts. Central midfielders need this quality more than any other position because they transition from defending to attacking and back repeatedly throughout the game.",
    cue: "The walk interval is recovery — use it, but start the next run on time."
  },
  "Format B: 10x suicide shuttles": {
    how: ["Set lines at 5m, 10m, 15m, 20m from a starting line.", "Sprint to 5m, touch line, return to start. Sprint to 10m, return. Sprint to 15m, return. Sprint to 20m, return. That's 1 rep.", "Rest 30-45 seconds between reps.", "10 full suicides."],
    why: "Suicide shuttles train the repeated acceleration and deceleration that mirrors soccer conditioning more closely than steady-state running. The constant direction changes also train the mental toughness of pushing through discomfort — which is what the last 15 minutes of a game demands.",
    cue: "Touch the line every time — cut corners and you're only cheating your own fitness."
  },
  "Format C: 10x 20 sec max bike / 40 sec easy": {
    how: ["Set bike resistance to challenging level.", "Sprint as hard as possible for 20 seconds.", "Recover at easy pace for 40 seconds.", "10 rounds total. Max effort means max effort — not cruise control."],
    why: "Bike intervals develop cardiovascular fitness with zero impact on your joints — perfect after a hard leg day or when you need conditioning work without the stress of running. The 20/40 ratio trains the short-burst recovery cycle that midfielders use every time they make a run and then have to recover position.",
    cue: "Max effort on every 20-second round — the first and last should feel equally hard."
  },
  "Format D: 15 min continuous aerobic run": {
    how: ["Steady pace run — conversational effort, about 6-7/10 effort.", "Consistent pace throughout — don't start fast and fade.", "Can be treadmill, track, or outside.", "Focus on breathing rhythm and relaxed form."],
    why: "Aerobic base fitness is the foundation everything else is built on. A strong aerobic engine allows you to recover faster between sprints, stay sharp mentally late in games, and handle the volume of training you're putting in this summer. This 15-minute run contributes more to your long-term development than it looks.",
    cue: "Slow enough to hold a conversation — this is base building, not racing."
  },
  // ── STRETCHING ─────────────────────────────────────────────────────────────
  "Hip flexor stretch — 90 sec each side": {
    how: ["Kneeling lunge: back knee on floor, front foot forward.", "Tuck your pelvis under — flatten the lower back curve.", "Shift weight forward gently until you feel stretch in front of back hip.", "Hold 90 seconds, breathe slowly. Switch sides."],
    why: "Hip flexors are chronically tight in soccer players from all the running and kicking. Tight hip flexors pull your pelvis forward, causing lower back pain and reducing your sprint stride length. This stretch directly addresses your ASIS history and prevents recurrence as you train hard.",
    cue: "Tuck the pelvis — that small adjustment is what actually stretches the hip flexor."
  },
  "Quad stretch — 60 sec each": {
    how: ["Stand on one leg, hold the ankle of the other leg behind you.", "Keep your knees together — don't let the stretched knee drift outward.", "Stand tall — don't lean forward.", "60 seconds each side. Use a wall for balance if needed."],
    why: "The quadriceps work extremely hard in soccer — every sprint, shot, and jump relies on them. Flexible quads reduce the anterior knee stress that causes patellar tendon problems in growing athletes. Regular quad stretching also improves your shooting power by allowing full hip extension.",
    cue: "Keep knees together — that's what gives you the full stretch."
  },
  "Hamstring stretch — 60 sec each": {
    how: ["Sit on the floor with one leg extended, other leg bent.", "Reach toward your extended foot, keeping your back flat.", "Feel the stretch in the back of your thigh — not your lower back.", "60 seconds each side. Breathe and relax into it."],
    why: "Hamstring strains are the #1 muscle injury in soccer. Flexible hamstrings reduce injury risk and allow a longer stride length in sprinting. After a heavy training session, this stretch helps flush lactic acid and begins the recovery process that gets you ready for tomorrow.",
    cue: "Flat back — lean from your hips, not your spine."
  },
  "Glute/piriformis stretch — 60 sec each": {
    how: ["Lie on your back. Cross one ankle over the opposite knee (figure-4 position).", "Gently pull both legs toward your chest until you feel a stretch in your glute.", "For more stretch, gently push the crossed knee away from you.", "60 seconds each side."],

  });

  // AI card

  const [weightLogs, setWeightLogs] = useState(() => lsGet("ua_weight", DEMO_WEIGHTS));
  const [benchmarkResults, setBenchmarkResults] = useState(() => lsGet("ua_benchmarks", DEMO_BENCHMARKS));
  const [testMode, setTestMode] = useState(false);
  const [testIdx, setTestIdx] = useState(0);
  const [testValues, setTestValues] = useState({});
  const [weightInput, setWeightInput] = useState("");
  const [selectedTest, setSelectedTest] = useState(null); // test id open in test day
  const [selectedBenchmark, setSelectedBenchmark] = useState(null); // drill-in metric id
  const [showWeightDetail, setShowWeightDetail] = useState(false);
  const timerRef = useRef(null);
  const restRef = useRef(null);

  // Persist key state to localStorage whenever it changes
  useEffect(() => {
    lsSet(LS_KEYS.logs, logs);
  }, [logs]);
  useEffect(() => {
    lsSet(LS_KEYS.completedKeys, completedKeys);
  }, [completedKeys]);
  useEffect(() => {
    lsSet(LS_KEYS.weekPlans, weekPlans);
  }, [weekPlans]);
  useEffect(() => {
    lsSet(LS_KEYS.draft, draftSession);
  }, [draftSession]);

    lsSet("ua_weight", weightLogs);
  }, [weightLogs]);
  useEffect(() => {
    lsSet("ua_benchmarks", benchmarkResults);
  }, [benchmarkResults]);
  useEffect(() => {
    if (timerRunning) timerRef.current = setInterval(() => setSessionTimer(t => t + 1), 1000);else clearInterval(timerRef.current);
    return () => clearInterval(timerRef.current);
  }, [timerRunning]);
  useEffect(() => {
    if (restRunning && restTimer > 0) {
      restRef.current = setInterval(() => setRestTimer(t => {
        if (t <= 1) {
          setRestRunning(false);
          return 0;
        }
        return t - 1;
      }), 1000);
    } else clearInterval(restRef.current);
    return () => clearInterval(restRef.current);
  }, [restRunning, restTimer]);
  const sessionKey = (w, d, i) => `${w}-${d}-${i}`;
  const isCompleted = (w, d, i) => !!completedKeys[sessionKey(w, d, i)];
  const getLog = (w, d, i) => {

    return id ? logs.find(l => l.id === id) : null;
  };

    });

        ...checkedItems

    }));

    setActiveSession(null);

      notes: "",
      minutes: ""
    });
    setTab("dashboard");

  // ── Canned Description Lookup ────────────────────────────────────────────────
  const getAiDescription = (item, sType) => {
    // Look up by exact name, then by partial match
    let desc = DESCRIPTIONS[item];
    if (!desc) {
      const key = Object.keys(DESCRIPTIONS).find(k => item.startsWith(k.split(" —")[0].trim()) || k.startsWith(item.split(" —")[0].trim()));
      desc = key ? DESCRIPTIONS[key] : null;
    }
    if (desc) {
      const bullet = desc.how.map(h => "• " + h).join("\n");
      const text = "**HOW TO DO IT:**\n" + bullet + "\n\n**WHY IT MATTERS FOR SOCCER:**\n" + desc.why + "\n\n**KEY CUE:**\n" + desc.cue;
      setAiDesc({
        item,
        loading: false,
        text
      });
    } else {
      setAiDesc({
        item,
        loading: false,
        text: "No description available for this exercise yet."
      });
    }
  };

  // ── Schedule helpers ────────────────────────────────────────────────────────
  const removeSession = (day, idx) => setWeekPlans(prev => {
    const p = deepCopy(prev[weekOffset] || DEFAULT_WEEK);

    return {
      ...prev,
      [weekOffset]: p
    };
  });
  const addSession = (day, type) => setWeekPlans(prev => {
    const p = deepCopy(prev[weekOffset] || DEFAULT_WEEK);
    p[day] = [...p[day], type];
    return {
      ...prev,
      [weekOffset]: p
    };
  });
  const weekStats = () => {
    const c = {};
    Object.values(currentPlan).forEach(ss => ss.forEach(s => {
      c[s] = (c[s] || 0) + 1;
    }));
    return c;
  };
  const getWeekActuals = wOff => {
    const result = {};
    Object.entries(completedKeys).forEach(([key, logId]) => {
      if (!key.startsWith(wOff + "-")) return;
      const log = logs.find(l => l.id === logId);
      if (!log) return;
      if (!result[log.type]) result[log.type] = {
        count: 0,
        totalMins: 0
      };
      result[log.type].count++;
      const mins = log.minutes ? parseInt(log.minutes) || 0 : Math.round(log.duration / 60);
      result[log.type].totalMins += mins;
    });
    return result;
  };
  const toggleWeek = wk => setExpandedWeeks(prev => {
    const next = new Set(prev);
    next.has(wk) ? next.delete(wk) : next.add(wk);
    return next;
  });
  const saveAndExit = destination => {
    setTimerRunning(false);
    if (activeSession) {
      setDraftSession({
        activeSession,
        checkedItems,
        checkedSets,
        sessionTimer
      });
    }
    setTab(destination);
  };
  const resumeDraft = () => {
    if (!draftSession) return;
    setActiveSession(draftSession.activeSession);
    setCheckedItems(draftSession.checkedItems);
    setCheckedSets(draftSession.checkedSets);
